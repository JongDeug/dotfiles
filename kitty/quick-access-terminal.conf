# kitten quick-access-terminal — 단축키(AeroSpace Option+`)로 화면 위에서 내려오는 터미널.
# 같은 단축키를 다시 누르면 들어간다.

# 화면 위쪽에서, 높이 22줄 (가로는 화면 끝까지).
edge top
lines 22

# 메인 창보다 조금 더 비치게.
background_opacity 0.88

# 다른 곳을 클릭하면 알아서 들어간다.
hide_on_focus_loss yes

# 화면 맨 위에 딱 붙지 않게 살짝 띄운다.
margin_top 6
margin_left 12
margin_right 12
