# iTerm2 에서 옮겨 온 것만 적는다. 나머지는 kitty 기본값.

# iTerm2 와 같은 폰트·크기. 한글도 이 폰트에 들어 있다.
font_family D2KodingLigature Nerd Font Mono
font_size   12.0

# Option = Meta. iTerm2 의 Left/Right Option "Esc+" 와 같다 — zshrc 의 단어 이동,
# herdr 의 alt 키가 이게 있어야 먹는다.
macos_option_as_alt yes

# --- 꾸미기 ---------------------------------------------------------------
# 커서가 움직이면 잔상이 꼬리처럼 따라온다. 숫자는 커서가 멈춰 있어야 하는 ms — 타이핑 중엔 안 나온다.
cursor_trail 3
cursor_trail_decay 0.1 0.4

# 살짝 비치는 배경 + 뒤를 흐리게 (macOS). 1 이면 불투명.
background_opacity 0.92
background_blur 24

# 글자가 창 가장자리에 붙지 않게.
window_padding_width 4 6

# kitty 탭(2개 이상일 때만 보인다) — 위쪽, 비스듬한 powerline.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# 제목 표시줄까지 없애려면(재시작 필요, 창을 끌어 옮기기 어려워진다):
# hide_window_decorations titlebar-only

# 테마 파일은 repo 에 담지 않는다 — 머신마다 `kitten themes Catppuccin-Macchiato` 가
# current-theme.conf 를 만들고 아래 블록을 그대로 다시 쓴다.
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# 테마 뒤에 둔다 — 테마 파일이 macos_titlebar_color system 으로 덮어쓴다.
# 제목 표시줄을 테마 배경색으로 — 창 위쪽이 따로 놀지 않는다.
macos_titlebar_color background
