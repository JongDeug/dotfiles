onboarding = false

# 기본값 "auto" 는 macOS 에서만 로그인 셸을 쓰고, 리눅스에서는 비로그인 셸로 띄운다.
# 그러면 .zshrc 를 읽지 않아 oh-my-zsh·테마·alias 가 전부 빠진 판이 열린다.
# 양쪽을 로그인 셸로 통일한다.
#
# default_shell 은 일부러 비워 둔다. $SHELL 을 그대로 따르게 해야 맥(/bin/zsh)과
# 리눅스(/usr/bin/zsh)가 같은 파일을 공유할 수 있다.
shell_mode = "login"
# ~/.tmux.conf 에 맞춘 키바인딩 (기본값과 같은 건 안 적음)
[keys]
# Prefix: C-b → C-Space
prefix = "ctrl+space"

# Detach: tmux 의 prefix+d (herdr 기본은 prefix+q)
detach = "prefix+d"

# 이름 변경도 tmux 대응대로. tmux 의 window=herdr 의 tab, session=workspace.
# , = rename-window → 탭, $ = rename-session → 워크스페이스
rename_tab = "prefix+,"
rename_workspace = "prefix+$"

# Split: tmux 의 | (좌우) / - (위아래)
split_vertical = "prefix+|"

# Window(=tab) 이동: Alt+←/→ (prefix 없이)
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# prefix+1..9 는 탭, prefix+shift+1..9 는 워크스페이스.
# 에이전트 점프는 prefix 없이 ctrl+1..9 직행 — alt 는 AeroSpace, cmd 는 iTerm 이 먹는다.
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+1..9"

# 직전 페인으로 토글 (tmux 의 prefix+; ). 탭 토글(tmux prefix+l)은 herdr 에 없다.
last_pane = "prefix+;"

# 에이전트 패널을 attention queue 로 쓸 때 앞뒤로 훑기
previous_agent = "prefix+["
next_agent = "prefix+]"

# 워크스페이스 순회 (번호 점프로 안 되는 경우용)
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"

# worktree 만들기는 기본 prefix+shift+g, 열기·삭제는 기본이 비어 있다.
# harness 가 spec 마다 워크트리를 만드므로 정리도 자주 한다 (삭제는 확인창이 뜬다)
open_worktree = "prefix+o"
remove_worktree = "prefix+shift+o"

# prefix+o 는 herdr 기본이 open_notification_target 이다. 비우지 않으면 한 키에
# 두 액션이 걸려 어느 쪽이 뜨는지 알 수 없다 — worktree 열기 쪽을 쓴다.
open_notification_target = ""

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# 기본 rows 는 아이콘만이라 상태가 글자로 안 뜬다. 상태(state_text), 어느 스페이스인지
# (workspace), 어느 탭인지(tab), 지금 무슨 작업인지(터미널 제목)까지 보여준다.
# agent_panel_sort = "spaces" 는 그룹 헤더를 그리지 않고 space 순으로만 정렬한다.
# 소속을 보여주는 건 이 workspace 토큰뿐이라 반드시 남겨둔다 (herdr 기본 rows 도 같은 이유로 포함).
# pane 은 `herdr pane rename` 을 해야 채워지고 36칸을 넘겨서 뺐다 — 필요하면 tab 대신 넣는다.
[ui.sidebar.agents]
rows = [["state_icon", "state_text", "workspace", "tab"], ["terminal_title_stripped"]]

[experimental]
# 한글 IME 가 켜진 상태에서도 prefix 가 먹도록, prefix 모드 동안만 ASCII 자판으로 전환한다.
switch_ascii_input_source_in_prefix = true

# Claude Code 처럼 자기 커서를 직접 그리는 TUI 에서 한글 후보창이 커서를 따라오게 한다.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

[theme]
name = "gruvbox"
auto_switch = false

[remote]
# `herdr --remote jongdeug` (라즈베리파이) 용. 기본값 true 는 herdr 가 자체 생성 ssh config 로
# 붙으면서 attach 마다 전용 control 소켓을 만든다 — Pi 는 키+비번 2단계라 그때마다 재인증이고,
# 반복 인증은 fail2ban 을 부른다. false 로 두면 ~/.ssh/config 의 ControlPersist 4h 마스터를
# 그대로 탄다. true 가 얹어주는 ServerAliveInterval 도 이미 ssh config 에 있어서 잃는 게 없다.
manage_ssh_config = false
