onboarding = false

# default_shell 은 비워 둔다. $SHELL 을 그대로 따른다.
# 기본값 "auto" 는 맥만 login 셸이라 리눅스에서 .zshrc 가 빠진다.
[terminal]
shell_mode = "login"

# ~/.tmux.conf 에 맞춘 키바인딩 (기본값과 같은 건 안 적음)
[keys]
# Prefix: C-b → C-Space. tmux 와 같은 키. 중첩이면 tmux 쪽 send-prefix.
prefix = "ctrl+space"

# 이름 변경: , = 탭, . = 워크스페이스
rename_tab = "prefix+,"
rename_workspace = "prefix+."

# Split: tmux 의 | (좌우) / - (위아래)
split_vertical = "prefix+|"

# Window(=tab) 이동: Alt+←/→ (prefix 없이). prefix+p/n 은 에이전트 순회로 넘겼다.
previous_tab = "alt+left"
next_tab = "alt+right"

# prefix+1..9 는 탭, prefix+shift+1..9 는 워크스페이스.
# 에이전트 점프는 prefix 없이 ctrl+1..9 직행 — alt 는 AeroSpace, cmd 는 iTerm 이 먹는다.
switch_workspace = "prefix+shift+1..9"
focus_agent = "ctrl+1..9"

# 직전 페인으로 토글 (tmux 의 prefix+; ). 탭 토글(tmux prefix+l)은 herdr 에 없다.
last_pane = "prefix+;"

# 에이전트 패널을 attention queue 로 쓸 때 앞뒤로 훑기.
# prefix+[ 는 copy_mode 기본값이라 비워 둔다 — 덮으면 스크롤백을 못 거슬러 올라간다.
previous_agent = "prefix+p"
next_agent = "prefix+n"

# 워크스페이스 순회 (번호 점프로 안 되는 경우용)
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"

# worktree 만들기는 기본 prefix+shift+g, 열기·삭제는 기본이 비어 있다.
# harness 가 spec 마다 워크트리를 만드므로 정리도 자주 한다 (삭제는 확인창이 뜬다)
open_worktree = "prefix+o"
remove_worktree = "prefix+shift+o"

# prefix+o 는 herdr 기본이 open_notification_target 이다. 비우지 않으면 한 키에
# 두 액션이 걸려 어느 쪽이 뜨는지 알 수 없다 — worktree 열기 쪽을 쓴다.
open_notification_target = ""

# prefix+shift+j 는 herdr 기본 swap_pane_down 이다. 비우지 않으면 한 키에 두 액션이
# 걸린다 (prefix+o 와 같은 이유). 페인 순서 바꾸기는 h/k/l 만 남긴다.
swap_pane_down = ""

# herdr-nvim. prefix+e 는 edit_scrollback, prefix+o 는 open_worktree 그대로 둔다.
# 페인 이동은 herdr 기본 prefix+h/j/k/l (Ctrl+Space 다음 h/j/k/l).
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

# fzf 로 레포를 골라 C 는 VSCode 만 띄우고(.zshrc 의 c), J 는 그 폴더에 새 페인을
# 연다(_pane_at). 커스텀 커맨드는 별도 프로세스라 살아 있는 페인의 cwd 를 못 바꾼다
# — 그래서 cd 가 아니라 split 이다.
# shell 타입은 detached 라 TTY 가 없어 fzf 가 죽는다. popup 이어야 한다.
# -i 는 .zshrc 를 읽으려고 (함수라 비대화형 셸엔 없다).
[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = 'exec "${SHELL:-sh}" -ic c'
description = "pick repo -> VSCode"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = 'exec "${SHELL:-sh}" -ic _pane_at'
description = "pick repo -> new pane"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# iurysza/herdr-pane-layouts (Python, 빌드 없음). 현재 탭 페인을 세로 컬럼으로 균등 분할.
# prefix+e 는 edit_scrollback 이라 shift+e 를 쓴다.
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "layouts.equalize"
description = "equalize panes"

# preset 목록이 pane 개수에 맞춰 생성된다 (2개: 반반, 3개+: main-left/main-top/tiled).
# tmux next-layout 과 같은 자리.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "layouts.cycle"
description = "cycle pane layouts"

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

# 기본 "dots" 는 blocked/working/done 이 색으로만 갈린다. 에이전트를 여러 개 굴리면
# 색보다 글리프가 빠르다.
status_indicators = "symbols"

# 탭바 우측 상태. zoom 은 페인을 확대해 둔 걸 잊지 않게 해주고, 나머지는 시계.
tab_bar_right = [{ type = "zoom" }, { type = "datetime", format = "%H:%M" }]

# 기본 rows 는 아이콘만이라 상태가 글자로 안 뜬다. 상태(state_text), 어느 스페이스인지
# (workspace), 어느 탭인지(tab), 지금 무슨 작업인지(터미널 제목)까지 보여준다.
# agent_panel_sort = "spaces" 는 그룹 헤더를 그리지 않고 space 순으로만 정렬한다.
# 소속을 보여주는 건 이 workspace 토큰뿐이라 반드시 남겨둔다 (herdr 기본 rows 도 같은 이유로 포함).
# pane 은 `herdr pane rename` 을 해야 채워지고 36칸을 넘겨서 뺐다 — 필요하면 tab 대신 넣는다.
[ui.sidebar.agents]
rows = [["state_icon", "$n", "state_text"], ["terminal_title_stripped"]]

[experimental]
# 서버 재시작(herdr update 포함) 후에도 페인 스크롤백을 살려둔다. 기본값 false 는
# 재시작 한 번에 떠 있던 에이전트 화면이 전부 날아간다.
pane_history = true

# 한글 IME 가 켜진 상태에서도 prefix 가 먹도록, prefix 모드 동안만 ASCII 자판으로 전환한다.
switch_ascii_input_source_in_prefix = true

# Claude Code 처럼 자기 커서를 직접 그리는 TUI 에서 한글 후보창이 커서를 따라오게 한다.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

[theme]
name = "gruvbox"
auto_switch = false

[remote]
# `herdr --remote jongdeug` (라즈베리파이) 용. 기본값 true 는 herdr 가 자체 생성 ssh config 로
# 붙으면서 attach 마다 전용 control 소켓을 만든다 — Pi 는 키+비번 2단계라 그때마다 재인증이고,
# 반복 인증은 fail2ban 을 부른다. false 로 두면 ~/.ssh/config 의 ControlPersist 4h 마스터를
# 그대로 탄다. true 가 얹어주는 ServerAliveInterval 도 이미 ssh config 에 있어서 잃는 게 없다.
manage_ssh_config = false
